<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0e1116">
<meta name="description" content="식품 이름만 치면 칼로리와 탄단지가 바로 나오는 개인용 식단 사전">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="칼로리 사전">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%97%3C/text%3E%3C/svg%3E">
<title>칼로리 사전 · 탄단지 즉시 검색</title>
<style>
:root{
  --bg:#0e1116; --panel:#161b22; --panel2:#1b222b; --line:#2a3340;
  --txt:#e6edf3; --dim:#8b98a8; --accent:#4ade80;
  --carb:#38bdf8; --prot:#a78bfa; --fat:#fbbf24;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.45;
}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 140px}

/* header */
header{position:sticky;top:0;z-index:30;background:rgba(14,17,22,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
header.stuck{border-bottom-color:var(--line)}
.hd{padding:14px 0 12px}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.brand h1{font-size:16px;font-weight:800;margin:0;letter-spacing:-.2px}
.brand span{font-size:12px;color:var(--dim)}
.search{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:rgba(74,222,128,.6);box-shadow:0 0 0 3px rgba(74,222,128,.12)}
.search .ico{font-size:17px;opacity:.55}
#q{flex:1;min-width:0;background:none;border:0;outline:0;color:inherit;font-size:19px;font-weight:700;letter-spacing:-.3px}
#q::placeholder{color:#5d6b7d;font-weight:600}
#clear{border:0;background:#242c36;color:var(--dim);width:26px;height:26px;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:12px}
#clear.on{display:flex}
.hint{font-size:12px;color:var(--dim);margin-top:8px;padding-left:2px}
.hint b{color:var(--accent);font-weight:700}

/* layout */
main{display:grid;gap:14px;grid-template-areas:"detail" "list";grid-template-columns:1fr;padding-top:14px}
@media(min-width:880px){
  main{grid-template-columns:minmax(0,1fr) 430px;grid-template-areas:"list detail";align-items:start}
  aside{position:sticky;top:132px}
}
@media(max-width:879px){
  #detail:not(.has){display:none}
}
section.list{grid-area:list}
aside{grid-area:detail;scroll-margin-top:126px}

/* list */
ul.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid transparent;border-radius:14px;padding:11px 14px;transition:background .12s,border-color .12s}
.row:hover{background:var(--panel2)}
.row.on{border-color:rgba(74,222,128,.55);background:rgba(74,222,128,.07)}
.row .left{flex:1;min-width:0}
.row .nm{display:block;font-size:16px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm em{font-style:normal;color:var(--accent)}
.row .meta{font-size:11.5px;color:var(--dim);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.row .meta .tag{background:#222a34;border-radius:5px;padding:1px 6px;font-size:10.5px}
.kcal{text-align:right;white-space:nowrap;flex:none}
.kcal b{font-size:19px;font-weight:800;letter-spacing:-.5px}
.kcal i{font-style:normal;font-size:10.5px;color:var(--dim);margin-left:2px}

/* detail */
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}
.empty{color:var(--dim);font-size:13.5px;text-align:center;padding:26px 12px}
.empty .big{font-size:30px;display:block;margin-bottom:8px;opacity:.7}
.tagline{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);background:rgba(74,222,128,.12);border-radius:6px;padding:2px 8px;margin-bottom:8px}
h2.food{font-size:24px;margin:0 0 14px;letter-spacing:-.7px;font-weight:800;line-height:1.25}
.servs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.serv{border:1px solid var(--line);background:#1b222b;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--dim)}
.serv.on{background:rgba(74,222,128,.13);border-color:rgba(74,222,128,.45);color:var(--accent)}
.hero{display:flex;align-items:flex-end;gap:10px;margin-bottom:4px}
.hero .num{font-size:46px;font-weight:800;letter-spacing:-2px;line-height:1;color:var(--accent)}
.hero .unit{font-size:14px;color:var(--dim);font-weight:700;padding-bottom:6px}
.sub{font-size:12px;color:var(--dim);margin-bottom:18px}
.mrows{display:flex;flex-direction:column;gap:11px}
.mrow{display:grid;grid-template-columns:58px 52px 1fr 34px;align-items:center;gap:8px;font-size:12.5px}
.mrow .lab{font-weight:700}
.mrow .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.mrow .pct{text-align:right;color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}
.track{height:7px;background:#232b35;border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;transition:width .25s ease}
.per100{font-size:11.5px;color:var(--dim);margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);font-variant-numeric:tabular-nums}
.tip{font-size:11.5px;color:#9fb0c2;background:#1b222b;border:1px solid #232c37;border-radius:10px;padding:8px 11px;margin-top:10px;line-height:1.55}
.addbtn{width:100%;margin-top:16px;border:0;border-radius:12px;background:var(--accent);color:#062a12;font-weight:800;font-size:14px;padding:13px;letter-spacing:-.2px}
.addbtn:active{transform:scale(.99)}

/* today */
.atb{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;border:1px solid var(--line);background:rgba(28,35,44,.95);backdrop-filter:blur(10px);border-radius:999px;padding:11px 20px;font-size:13px;font-weight:700;box-shadow:0 8px 28px rgba(0,0,0,.45);display:flex;align-items:center;gap:8px}
.atb b{color:var(--accent);font-size:15px;font-variant-numeric:tabular-nums}
.panel{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));z-index:39;width:min(440px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.55);max-height:60vh;overflow:auto}
.panel h3{margin:0 0 10px;font-size:13px;color:var(--dim);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.panel h3 button{background:none;border:0;color:#7d8b9c;font-size:11.5px;text-decoration:underline}
.plist{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.plist li{display:flex;justify-content:space-between;gap:8px;color:#c9d4df}
.plist li span:last-child{font-variant-numeric:tabular-nums;color:var(--dim)}
.tot{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border-top:1px solid var(--line);padding-top:12px;text-align:center}
.tot div b{display:block;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.tot div span{font-size:10.5px;color:var(--dim)}

/* dialog */
dialog{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:18px;padding:20px;width:min(380px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin:0 0 14px;font-size:16px}
dialog label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:4px}
dialog input{width:100%;background:#0f141a;border:1px solid var(--line);border-radius:9px;color:inherit;padding:9px 11px;font-size:14px;outline:0;margin-bottom:10px}
dialog input:focus{border-color:rgba(74,222,128,.6)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
dialog .act{display:flex;gap:8px;margin-top:6px}
dialog .act button{flex:1;border-radius:10px;padding:11px;border:1px solid var(--line);background:#1b222b;font-weight:700;font-size:13px}
dialog .act .ok{background:var(--accent);color:#062a12;border:0}
footer{margin-top:26px;font-size:11.5px;color:#5f6c7d;line-height:1.7;text-align:center}
footer button{background:none;border:0;color:#7d8b9c;text-decoration:underline;font-size:11.5px}
.none{padding:34px 10px;text-align:center;color:var(--dim);font-size:13.5px}
.none b{color:var(--txt)}
</style>
</head>
<body>
<header id="hd">
  <div class="wrap hd">
    <div class="brand">
      <h1>🥗 칼로리 사전</h1>
      <span>탄단지 즉시 검색</span>
    </div>
    <div class="search">
      <span class="ico">🔍</span>
      <input id="q" placeholder="두부, 닭가슴살, ㄷㅂ …" autocomplete="off" spellcheck="false" enterkeyhint="search">
      <button id="clear" aria-label="지우기">✕</button>
    </div>
    <div class="hint" id="hint"></div>
  </div>
</header>

<div class="wrap">
<main>
  <section class="list">
    <ul class="rows" id="rows"></ul>
  </section>
  <aside>
    <div id="detail"></div>
  </aside>
</main>

<footer>
  수치는 식약처·농촌진흥청 식품성분DB를 참고한 <b>100g 기준 근사치</b>예요.<br>
  조리법·브랜드에 따라 달라지니 정확한 값은 제품 표기를 확인하세요.<br><br>
  <button id="openAdd">+ 내 음식 직접 추가</button>
</footer>
</div>

<button class="atb" id="atb">오늘 <b id="atbK">0</b> kcal</button>
<div class="panel" id="panel" hidden></div>

<dialog id="dlg">
  <form method="dialog" id="addForm">
    <h3>내 음식 추가 (100g 기준)</h3>
    <label>이름</label>
    <input id="fn" required placeholder="예) 어머니표 잡채">
    <div class="grid2">
      <div><label>칼로리</label><input id="fk" type="number" step="0.1" required placeholder="kcal"></div>
      <div><label>탄수화물</label><input id="fc" type="number" step="0.1" required placeholder="g"></div>
      <div><label>단백질</label><input id="fp" type="number" step="0.1" required placeholder="g"></div>
      <div><label>지방</label><input id="ff" type="number" step="0.1" required placeholder="g"></div>
    </div>
    <div class="act">
      <button type="button" id="cancelAdd">취소</button>
      <button class="ok" type="submit" value="ok">저장</button>
    </div>
  </form>
</dialog>

/* ---------------- setup ---------------- */
const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const JUNG = "ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ";
const JONG = " ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ";

const toFood = ([n,g,k,ca,pr,fa,s]) => ({
  n, g, k, ca, pr, fa,
  s: (s && s.length) ? s : [["100g",100]]
});

const LS = {
  get(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};

let customs = LS.get("cd.custom", [])
  .filter(x => x && x.n && typeof x.k === "number")
  .map(x => ({ n:x.n, g:x.g || "내 음식", k:x.k, ca:x.ca, pr:x.pr, fa:x.fa,
               s:(x.s && x.s.length) ? x.s : [["100g",100]] }));
let foods = RAW.map(toFood).concat(customs);

const $ = s => document.querySelector(s);

      hintEl = $("#hint"), clearEl = $("#clear"), panelEl = $("#panel"), atbK = $("#atbK");

/* ---------------- 검색 ---------------- */
function toJamo(s){
  let out = "";
  for (const ch of s){
    const c = ch.charCodeAt(0);
    if (c >= 0xAC00 && c <= 0xD7A3){
      const i = c - 0xAC00;
      out += CHO[Math.floor(i/588)];
      out += JUNG[Math.floor((i%588)/28)];
      const t = i % 28;
      if (t) out += JONG[t];
    } else out += ch;
  }
  return out;
}
function choseong(s){
  let out = "";
  for (const ch of s){
    const c = ch.charCodeAt(0);
    out += (c >= 0xAC00 && c <= 0xD7A3) ? CHO[Math.floor((c-0xAC00)/588)] : ch;
  }
  return out;
}
const isJamo = q => /^[ㄱ-ㅎ]+$/.test(q);

function score(f, q, toks){
  const name = norm(f.n.replace(/\s+/g,""));
  if (name === q) return 100;
  // 괄호 앞이 이름과 똑같으면 대표 메뉴 (예: "계란" → 계란(삶은)이 계란국보다 먼저)
  if (name.split("(")[0] === q) return 95;
  if (name.startsWith(q)) return 90;
  if (name.includes(q)) return 70;
  // 띄어쓰기 순서 무관 (예: "삶은 닭가슴살" → 닭가슴살(삶은))
  if (toks && toks.length > 1 && toks.every(t => name.includes(t))) return 65;
  // 분류명을 그대로 입력한 경우 (김치, 과일, 반찬 …) → 그 분류 전체
  if (f.g.replace(/·/g,"") === q) return 25;
  if (isJamo(q)){
    const cs = choseong(name);
    if (cs === q) return 66;
    if (cs.startsWith(q)) return 60;
    if (cs.includes(q)) return 40;
    return -1;
  }
  const nj = toJamo(name), qj = toJamo(q);
  if (nj.startsWith(qj)) return 55;
  if (nj.includes(qj)) return 35;
  return -1;
}

let groupMode = false;   // 이름이 아니라 분류명으로 찾은 경우

function search(q){
  const raw = norm(q.trim());
  const nq = raw.replace(/\s+/g,"");
  const toks = raw.split(/\s+/).filter(Boolean);
  groupMode = false;
  if (!nq) return foods.slice();
  const scored = [];
  foods.forEach((f,i) => {
    const s = score(f, nq, toks);
    if (s > 0) scored.push([s, i, f]);
  });
  // 이름에서 못 찾으면 분류명으로 (예: "채소", "음료", "유제품")
  if (!scored.length){
    groupMode = true;
    foods.forEach((f,i) => {
      if (f.g.replace(/·/g,"").includes(nq)) scored.push([18, i, f]);
    });
    scored.sort((a,b) => a[1]-b[1]);
  } else {
    scored.sort((a,b) => b[0]-a[0] || a[1]-b[1]);
  }
  return scored.map(x => x[2]);
}

/* ---------------- 렌더 ---------------- */
const r1 = x => (Math.round(x*10)/10).toString();
const num = x => Math.round(x).toLocaleString("ko-KR");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

// 국·찌개와 샐러드는 같은 100g이라도 담긴 양에 따라 크게 달라져서 따로 안내
const NOTE = {
  "국·찌개": "🍲 국물까지 포함한 기준이에요. 국물을 남기면 칼로리·나트륨이 확 줄어요.",
  "샐러드": "🥗 드레싱 양에 따라 ±100kcal 차이가 나요. 드레싱은 따로 더해주세요.",
  "프랜차이즈": "🍔 대표 메뉴 1개 기준 근사치예요. 사이즈·세트 여부·조리법에 따라 차이가 커요."
};

// 자주 틀리거나 다르게 부르는 말 보정
const SYN = [
  ["오뎅", "어묵"],       // 오뎅 → 어묵
  ["칼치", "갈치"],       // 칼치속젓 → 갈치속젓
  ["간장개장", "간장게장"],   // '개장'은 육개장을 건드리지 않게 앞말까지 지정
  ["양념개장", "양념게장"],
  ["자장면", "짜장면"],
  ["삶은계란", "계란"],   // 삶은계란 → 계란
  ["삶은달걀", "계란"],
  ["달걀", "계란"],
  ["요구르트", "요거트"],
  ["떡복이", "떡볶이"],
  ["떡볶기", "떡볶이"],
  ["라멘", "라면"],
  ["쏘주", "소주"]
];
const norm = s => {
  let t = s.replace(/찌게|찌계/g, "찌개");
  for (const [a, b] of SYN) if (t.indexOf(a) >= 0) t = t.split(a).join(b);
  return t;
};

function hl(name, q){
  const nq = q.trim().replace(/\s+/g,"");
  if (!nq) return esc(name);
  const i = name.replace(/\s+/g,"").indexOf(nq);
  if (i < 0) return esc(name);
  // 공백 무시 인덱스를 원문 인덱스로 변환
  let raw = 0, cnt = 0;
  while (raw < name.length && cnt < i){ if (!/\s/.test(name[raw])) cnt++; raw++; }
  let end = raw, c2 = 0;
  while (end < name.length && c2 < nq.length){ if (!/\s/.test(name[end])) c2++; end++; }
  return esc(name.slice(0,raw)) + "<em>" + esc(name.slice(raw,end)) + "</em>" + esc(name.slice(end));
}

function renderList(){
  const q = qEl.value;
  results = search(q);
  active = -1;

  if (!results.length){
    rowsEl.innerHTML = '<div class="none">검색 결과가 없어요.<br><b>다른 이름</b>으로 찾거나 <b>+ 내 음식 직접 추가</b>를 눌러보세요.</div>';
    hintEl.innerHTML = q.trim() ? `"${esc(q.trim())}" · 결과 0개` : "";
    return;
  }
  hintEl.innerHTML = q.trim()
    ? `"${esc(q.trim())}" · ${groupMode ? "분류 " : ""}<b>${results.length}개</b>`
    : `이름 일부만 쳐도 돼요 · 초성(ㄷㅂ)도 OK`;

  rowsEl.innerHTML = results.map((f,i) => `
    <li>
      <button class="row${sel && sel.n===f.n ? " on" : ""}" data-i="${i}">
        <span class="left">
          <span class="nm">${hl(f.n,q)}</span>
          <span class="meta"><span class="tag">${esc(f.g)}</span>
            <span>탄 ${r1(f.ca)} · 단 ${r1(f.pr)} · 지 ${r1(f.fa)}</span></span>
        </span>
        <span class="kcal"><b>${num(f.k)}</b><i>kcal</i></span>
      </button>
    </li>`).join("");
}

function renderDetail(){
  detailEl.classList.toggle("has", !!sel);
  if (!sel){
    detailEl.innerHTML = `<div class="card"><div class="empty">
      <span class="big">🍽️</span>
      위에 <b>두부</b>, <b>닭가슴살</b>처럼 입력하면<br>칼로리와 탄단지가 바로 나와요.
    </div></div>`;
    return;
  }
  const f = sel;
  const [label, g] = f.s[selServ] || f.s[0];
  const m = g/100;
  const k = f.k*m, ca = f.ca*m, pr = f.pr*m, fa = f.fa*m;
  const kcalC = ca*4, kcalP = pr*4, kcalF = fa*9;
  const macroK = kcalC + kcalP + kcalF;        // 제공량 기준 탄단지 열량
  const macro100 = f.ca*4 + f.pr*4 + f.fa*9;   // 100g 기준 (안내문 판단용)
  const isAlc = f.k - macro100 > 20;           // 술: 알코올 열량은 탄단지에 없음
  const isFiber = macro100 - f.k > 40;         // 김·미역: 식이섬유는 열량으로 안 침
  const tot = (isAlc ? k : macroK) || 1;
  const pc = x => Math.max(0, Math.round(x/tot*100));
  const bar = (v,color) => `<div class="track"><i style="width:${Math.max(v,1.5)}%;background:${color}"></i></div>`;

  detailEl.innerHTML = `<div class="card">
    <span class="tagline">${esc(f.g)}</span>
    <h2 class="food">${esc(f.n)}</h2>
    <div class="servs">${f.s.map((s,i) =>
      `<button class="serv${i===selServ?" on":""}" data-s="${i}">${s[0]} · ${s[1]}g</button>`).join("")}</div>
    <div class="hero"><span class="num">${num(k)}</span><span class="unit">kcal</span></div>
    <div class="sub">${label} ${g}g 기준</div>
    <div class="mrows">
      <div class="mrow"><span class="lab" style="color:var(--carb)">탄수화물</span><span class="val">${r1(ca)}g</span>${bar(pc(kcalC),"var(--carb)")}<span class="pct">${pc(kcalC)}%</span></div>
      <div class="mrow"><span class="lab" style="color:var(--prot)">단백질</span><span class="val">${r1(pr)}g</span>${bar(pc(kcalP),"var(--prot)")}<span class="pct">${pc(kcalP)}%</span></div>
      <div class="mrow"><span class="lab" style="color:var(--fat)">지방</span><span class="val">${r1(fa)}g</span>${bar(pc(kcalF),"var(--fat)")}<span class="pct">${pc(kcalF)}%</span></div>
    </div>
    <div class="per100">100g당 ${num(f.k)}kcal · 탄 ${r1(f.ca)}g · 단 ${r1(f.pr)}g · 지 ${r1(f.fa)}g</div>
    ${NOTE[f.g] ? `<div class="tip">${NOTE[f.g]}</div>` : ""}
    ${isAlc ? `<div class="tip">🍺 알코올 열량이라 탄단지 합과 달라요 · 100g 칼로리의 약 ${Math.round((f.k-macro100)/f.k*100)}%가 알코올</div>` : ""}
    ${isFiber ? `<div class="tip">🌿 식이섬유가 많아 탄단지 합보다 칼로리가 낮아요 (탄수화물에 식이섬유 포함)</div>` : ""}
    <button class="addbtn" id="addLog">+ 오늘 먹은 것에 추가</button>
  </div>`;
}

function pick(f, noScroll){
  sel = f; selServ = 0;
  renderDetail();
  renderList();
  if (!noScroll && matchMedia("(max-width: 879px)").matches){
    detailEl.scrollIntoView({behavior:"smooth", block:"start"});
  }
}

/* ---------------- 오늘 기록 ---------------- */
function today(){ return new Date().toLocaleDateString("sv-SE"); }

function loadLog(){
  const d = LS.get("cd.log", null);
  if (!d || d.date !== today()) return { date: today(), items: [] };
  return d;
}
function saveLog(){ LS.set("cd.log", log); }
function logTotal(){
  return log.items.reduce((a,i) => ({
    k:a.k+i.k, ca:a.ca+i.ca, pr:a.pr+i.pr, fa:a.fa+i.fa
  }), {k:0,ca:0,pr:0,fa:0});
}
function renderAtb(){
  atbK.textContent = num(logTotal().k);
  if (!panelEl.hidden) renderPanel();
}
function renderPanel(){
  const t = logTotal();
  panelEl.innerHTML = `<h3>오늘 먹은 것 <button id="rst">전체 삭제</button></h3>
    ${log.items.length
      ? `<ul class="plist">${log.items.map((i,x) =>
          `<li><span>${esc(i.n)} <small style="color:#5f6c7d">${esc(i.label)} ${i.g}g</small></span>
           <span>${num(i.k)} kcal <button data-del="${x}" style="background:none;border:0;color:#5f6c7d;padding:0 0 0 6px">✕</button></span></li>`).join("")}</ul>`
      : `<div style="color:#7d8b9c;font-size:12.5px;padding:6px 0 14px">아직 기록이 없어요. 검색해서 추가해 보세요.</div>`}
    <div class="tot">
      <div><b>${num(t.k)}</b><span>kcal</span></div>
      <div><b style="color:var(--carb)">${r1(t.ca)}</b><span>탄수 g</span></div>
      <div><b style="color:var(--prot)">${r1(t.pr)}</b><span>단백 g</span></div>
      <div><b style="color:var(--fat)">${r1(t.fa)}</b><span>지방 g</span></div>
    </div>`;
}

/* ---------------- 이벤트 ---------------- */
let t = null;
qEl.addEventListener("input", () => {
  clearEl.classList.toggle("on", !!qEl.value);
  clearTimeout(t);
  t = setTimeout(renderList, 30);
});

clearEl.addEventListener("click", () => {
  qEl.value = ""; clearEl.classList.remove("on");
  renderList(); qEl.focus();
});

qEl.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){
    e.preventDefault();
    if (!results.length) return;
    const max = results.length;
    active = e.key === "ArrowDown"
      ? (active + 1) % max
      : (active - 1 + max) % max;
    [...rowsEl.querySelectorAll(".row")].forEach((el,i) => el.classList.toggle("on", i === active));
    const el = rowsEl.querySelectorAll(".row")[active];
    if (el) el.scrollIntoView({block:"nearest"});
  } else if (e.key === "Enter"){
    e.preventDefault();
    const f = results[active >= 0 ? active : 0];
    if (f) pick(f);
  } else if (e.key === "Escape"){
    qEl.value = ""; clearEl.classList.remove("on"); renderList();
  }
});

rowsEl.addEventListener("click", e => {
  const btn = e.target.closest(".row");
  if (!btn) return;
  const f = results[+btn.dataset.i];
  if (f) pick(f);
});

detailEl.addEventListener("click", e => {
  const s = e.target.closest(".serv");
  if (s){ selServ = +s.dataset.s; renderDetail(); return; }
  if (e.target.id === "addLog" && sel){
    const [label, g] = sel.s[selServ] || sel.s[0];
    const m = g/100;
    log.items.push({
      n: sel.n, label, g,
      k: sel.k*m, ca: sel.ca*m, pr: sel.pr*m, fa: sel.fa*m
    });
    saveLog(); renderAtb();
    const b = $("#addLog");
    if (b){ b.textContent = "✓ 추가됨"; b.style.background = "#2b3a30"; b.style.color = "var(--accent)";
      setTimeout(() => { if (b.isConnected){ b.textContent = "+ 오늘 먹은 것에 추가"; b.style.background=""; b.style.color=""; } }, 900); }
  }
});

$("#atb").addEventListener("click", () => {
  panelEl.hidden = !panelEl.hidden;
  if (!panelEl.hidden) renderPanel();
});

panelEl.addEventListener("click", e => {
  if (e.target.id === "rst"){ log = { date: today(), items: [] }; saveLog(); renderAtb(); renderPanel(); return; }
  const d = e.target.dataset && e.target.dataset.del;
  if (d != null){ log.items.splice(+d,1); saveLog(); renderAtb(); renderPanel(); }
});

document.addEventListener("click", e => {
  if (!panelEl.hidden && !e.target.closest("#panel") && !e.target.closest("#atb")) panelEl.hidden = true;
});

/* 내 음식 추가 */
const dlg = $("#dlg");
$("#openAdd").addEventListener("click", () => dlg.showModal());
$("#cancelAdd").addEventListener("click", () => dlg.close());
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
$("#addForm").addEventListener("submit", e => {
  const f = {
    n: $("#fn").value.trim(), g: "내 음식",
    k: +$("#fk").value, ca: +$("#fc").value, pr: +$("#fp").value, fa: +$("#ff").value,
    s: [["100g",100]]
  };
  if (!f.n) return;
  customs.push(f);
  LS.set("cd.custom", customs);
  foods = RAW.map(toFood).concat(customs);
  $("#addForm").reset();
  qEl.value = f.n; clearEl.classList.add("on");
  renderList();
  const hit = results.find(x => x.n === f.n);
  if (hit) pick(hit);
});

/* sticky header shadow */
addEventListener("scroll", () => {
  $("#hd").classList.toggle("stuck", scrollY > 4);
}, {passive:true});

/* init */
let hashQ = "";
try { hashQ = decodeURIComponent((location.hash || "").slice(1)).trim(); } catch(e){ hashQ = ""; }
if (hashQ){ qEl.value = hashQ; clearEl.classList.add("on"); }
renderList();
renderDetail();
renderAtb();
if (hashQ){
  const hit = foods.find(x => x.n === hashQ);
  if (hit) pick(hit, true);
}
if (innerWidth >= 880 && !hashQ) qEl.focus();
</script>
</body>
</html>
